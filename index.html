<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>만점백과</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════ [1] 공통 스타일 ═══════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--gold:#c8a96e;--gold2:#e8c98a;--gb:rgba(200,169,110,0.3);--text:#f0ead8;--dim:rgba(240,234,216,0.5);--muted:rgba(240,234,216,0.3);--ih:44px;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

/* ═══════════════ [2] 화면 전환 시스템 ═══════════════ */
.screen{position:fixed;inset:0;background:var(--bg);overflow-y:auto;overflow-x:hidden;transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s;-webkit-overflow-scrolling:touch; z-index:1;}
.screen.hidden{transform:translateX(100%);pointer-events:none;opacity:0}
.screen.active{transform:translateX(0);opacity:1}

/* ═══════════════ [3] 광고 배너 스타일 (추가됨) ═══════════════ */
.ad-container {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 420px;
  height: 60px;
  background: var(--bg2);
  border-top: 1px solid var(--gb);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  display: none; /* 초기에는 숨김 */
}
.ad-text { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

/* 광고 공간 확보를 위한 여백 */
.main-inner, .calc-inner, .app, .unse-inner { padding-bottom: 80px !important; }

/* ═══════════════ [4] 각 화면별 디자인 ═══════════════ */
/* 스플래시 */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:100}
.sp-sym{font-size:48px;letter-spacing:12px;color:var(--gold);font-family:'Noto Serif KR',serif;font-weight:300;animation:spIn 1s ease forwards;opacity:0}
.sp-title{font-family:'Noto Serif KR',serif;font-size:32px;font-weight:600;color:var(--gold2);letter-spacing:6px;margin-top:12px;animation:spIn 1s .3s ease forwards;opacity:0}
@keyframes spIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* 메인 메뉴 */
.main-inner{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:32px}
.main-hdr{text-align:center;padding:52px 24px 28px;position:relative}
.main-title{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:700;color:var(--gold2);letter-spacing:5px}
.menu-section{padding:0 16px}
.menu-label{font-size:10px;color:var(--muted);letter-spacing:3px;margin-bottom:12px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.menu-card{background:var(--bg2);border:1px solid var(--gb);border-radius:16px;padding:20px 16px;cursor:pointer;position:relative}
.menu-card.main-card{grid-column:1/-1;display:flex;align-items:center;gap:16px}
.mc-title{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;color:var(--gold2)}

/* 만세력 UI */
.app{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hdr{text-align:center;padding:32px 24px 16px}
.hdr-ttl{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:600;color:var(--gold2);letter-spacing:4px}
.card{margin:0 16px 14px;background:var(--bg2);border:1px solid var(--gb);border-radius:16px;overflow:hidden}
.srow{display:flex;justify-content:space-between;padding:14px 16px 8px;gap:10px}
.tg{display:flex;background:var(--bg3);border:1px solid var(--gb);border-radius:10px;overflow:hidden;flex:1}
.tb{flex:1;height:36px;background:transparent;border:none;font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--dim);cursor:pointer}
.tb.on{background:rgba(200,169,110,0.15);color:var(--gold2);font-weight:500}
.pw{display:flex;height:220px;position:relative;padding:0 8px}
.phl{position:absolute;top:50%;left:8px;right:8px;transform:translateY(-50%);height:var(--ih);border-top:1px solid var(--gb);border-bottom:1px solid var(--gb);pointer-events:none;z-index:10;background:rgba(200,169,110,0.06)}
.ci{will-change:transform} .citem{height:var(--ih);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--dim);font-family:'Noto Serif KR',serif}
.citem.sel{color:var(--gold2);font-size:17px;font-weight:600}
.bw{padding:2px 16px 14px} .bcalc{width:100%;height:52px;background:linear-gradient(135deg,#8b7340,#c8a96e,#8b7340);border:none;border-radius:12px;color:#1a1208;font-size:16px;font-weight:700;cursor:pointer}
.result{display:none;margin:0 16px 16px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sc{background:var(--bg3);border:1px solid var(--gb);border-radius:12px;padding:10px 4px;text-align:center}
.shj{font-family:'Noto Serif KR',serif;font-size:20px;color:var(--text);line-height:1.3}
.bai{width:100%;height:48px;background:transparent;border:1px solid var(--gb);border-radius:12px;color:var(--gold);font-family:'Noto Serif KR',serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.aisec{display:none;background:var(--bg3);border:1px solid var(--gb);border-radius:14px;padding:18px 16px}
.aisec.show{display:block}
.aitxt{font-size:14px;line-height:1.9;color:var(--dim);word-break:keep-all;white-space:pre-wrap}

/* 상단 뒤로가기 바 */
.calc-topbar{display:flex;align-items:center;padding:16px 16px 8px;gap:12px}
.back-btn{width:36px;height:36px;background:transparent;border:1px solid var(--gb);border-radius:10px;color:var(--gold);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

::-webkit-scrollbar{display:none}
</style>
</head>
<body>

<div id="splash" class="screen active">
  <div class="sp-sym">☰ ☱ ☲ ☳</div>
  <div class="sp-title">만점백과</div>
  <div class="sp-sub">AI 사주 · 만세력</div>
</div>

<div id="mainScreen" class="screen hidden">
  <div class="main-inner">
    <div class="main-hdr">
      <div class="main-title">만점백과</div>
    </div>
    <div class="menu-section">
      <div class="menu-label">사주 분석</div>
      <div class="menu-grid">
        <div class="menu-card main-card" onclick="goCalc()">
          <span style="font-size:32px">✦</span>
          <div>
            <div class="mc-title">사주 풀이</div>
            <div class="mc-desc">생년월일시로 나의 사주를<br>AI가 정밀 분석해드립니다</div>
          </div>
        </div>
      </div>
      <div class="menu-label">오늘 · 내일 운세</div>
      <div class="menu-grid">
        <div class="menu-card" onclick="goUnse('today')">
          <div class="mc-title">오늘의 운세</div>
        </div>
        <div class="menu-card" onclick="goUnse('tomorrow')">
          <div class="mc-title">내일의 운세</div>
        </div>
      </div>
      <div class="menu-label">나의 사주 기록</div>
      <div id="recentList"></div>
    </div>
  </div>
</div>

<div id="calcScreen" class="screen hidden">
  <div class="calc-inner">
    <div class="calc-topbar">
      <button class="back-btn" onclick="goMain()">‹</button>
      <span class="hdr-ttl" style="font-size:16px">만세력 · 사주 풀이</span>
    </div>
    <div class="app">
      <div class="card">
        <div class="srow">
          <div class="tg">
            <button class="tb on" id="bSol" onclick="setCal('solar')">양력</button>
            <button class="tb" id="bLun" onclick="setCal('lunar')">음력</button>
          </div>
          <div class="tg">
            <button class="tb mon" id="bMal" onclick="setGen('male')">남 ♂</button>
            <button class="tb" id="bFem" onclick="setGen('female')">여 ♀</button>
          </div>
        </div>
        <div class="pw" id="pw"><div class="phl"></div></div>
      </div>
      <div class="bw"><button class="bcalc" onclick="calc()">사주 풀기</button></div>
      <div id="result" class="result">
        <div class="card" style="padding:16px">
          <div id="rhdr" style="text-align:center; margin-bottom:16px"></div>
          <div id="sg" class="sg"></div>
          <button class="bai" id="bai" onclick="reqAI()">✦ AI 사주 풀이 받기</button>
          <div id="aisecs" class="aip" style="margin-top:15px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="unseScreen" class="screen hidden">
  <div class="unse-inner">
    <div class="calc-topbar">
      <button class="back-btn" onclick="goMain()">‹</button>
      <span id="unseTopTitle" class="hdr-ttl" style="font-size:16px">오늘의 운세</span>
    </div>
    <div id="unseContent" style="padding:16px">
      <div id="unseSecs"></div>
    </div>
  </div>
</div>

<div class="ad-container" id="adBanner">
  <div class="ad-text">ADVERTISEMENT</div>
</div>

<script>
/* ═══════════════ 엔진 로직 ═══════════════ */
const CG=['갑','을','병','정','무','기','경','신','임','계'], CH=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const JJ=['자','축','인','묘','진','사','오','미','신','유','술','해'], JH=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const ANI=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];

function jd(y,m,d,h){if(h===undefined)h=12;if(m<=2){y--;m+=12;}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5+h/24;}
function slon(j){const T=(j-2451545)/36525,L0=((280.46646+36000.76983*T+.0003032*T*T)%360+360)%360,M=((357.52911+35999.05029*T-.0001537*T*T)%360+360)%360*Math.PI/180,C=(1.914602-.004817*T-.000014*T*T)*Math.sin(M)+(.019993-.000101*T)*Math.sin(2*M)+.000289*Math.sin(3*M),om=(125.04-1934.136*T)*Math.PI/180;return((L0+C-.00569-.00478*Math.sin(om))%360+360)%360;}
function fjd(y,lon,am){const j0=jd(y,am,1);let lo=j0-20,hi=j0+20;function dv(v){let x=slon(v)-lon;if(x>180)x-=360;else if(x<-180)x+=360;return x;}for(let i=0;i<50;i++){const mid=(lo+hi)/2;if(dv(lo)*dv(mid)<=0)hi=mid;else lo=mid;}return(lo+hi)/2;}
function mpillar(bjd,by){const pool=[];for(const y of[by-1,by,by+1])for(const[n,l,am,br,mn]of [[ '입춘', 315, 2, 2, 1 ]]) pool.push([fjd(y,l,am),n,br,mn]);pool.sort((a,b)=>a[0]-b[0]);let best=pool[0];for(const e of pool){if(e[0]<=bjd)best=e;else break;}return{n:best[1],br:best[2],mn:best[3]};}
function calcSaju(Y,M,D,H,MIN){if(MIN===undefined)MIN=0;const dt=new Date(Y,M-1,D,H-9,MIN,0),bjd=jd(dt.getFullYear(),dt.getMonth()+1,dt.getDate(),dt.getHours()+dt.getMinutes()/60),ip=fjd(Y,315,2),sy=bjd>=ip?Y:Y-1,ys=((sy-4)%10+10)%10,yb=((sy-4)%12+12)%12,ms=((ys%5*2+2)%10+1)%10,djd=jd(Y,M,D,12),di=(Math.floor(djd+.5)+49)%60,ds=di%10,db=di%12,hb=Math.floor((H+1)/2)%12,hs=((ds%5*2)%10+hb)%10;return{ys,yb,ms,mb:1,ds,db,hs,hb};}

/* ═══════════════ 화면 제어 ═══════════════ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.classList.add('hidden'); });
  const el = document.getElementById(id);
  el.classList.remove('hidden'); el.classList.add('active');
  el.scrollTop = 0;
}
function goMain(){ showScreen('mainScreen'); renderRecent(); }
function goCalc(){ showScreen('calcScreen'); }
function goUnse(type){ 
  document.getElementById('unseTopTitle').textContent = type==='today'?'오늘의 운세':'내일의 운세';
  showScreen('unseScreen'); 
  if(LD) reqUnseAI(type); else document.getElementById('unseSecs').innerHTML="사주를 먼저 계산해주세요.";
}

/* ═══════════════ ❗ 광고 로직 (추가됨) ═══════════════ */
async function initAdMob() {
  try {
    const { AdMob, BannerAdSize, BannerAdPosition } = capacitorAdMob;
    await AdMob.initialize();
    await AdMob.showBanner({
      adId: 'ca-app-pub-3940256099942544/6300978111', // 테스트 ID (나중에 본인 ID로 변경)
      adSize: BannerAdSize.BANNER,
      position: BannerAdPosition.BOTTOM_CENTER,
      margin: 0, isTesting: true
    });
  } catch(e) { console.log("AdMob 준비 중..."); }
}

/* ═══════════════ ❗ 앱 로드 & 스플래시 & 광고 실행 (추가/수정됨) ═══════════════ */
window.addEventListener('load', function(){
  // 1. 네이티브 스플래시 숨기기
  try { capacitorSplashScreen.SplashScreen.hide(); } catch(e) {}

  // 2. 1.8초 뒤 스플래시 화면을 숨기고 메인 화면을 보여줌
  setTimeout(function(){
    showScreen('mainScreen');
    renderRecent();
    
    // 3. 메인 화면이 뜰 때 광고 배너(HTML 영역)를 켜고 실제 광고를 부름
    document.getElementById('adBanner').style.display = 'flex';
    initAdMob();
  }, 1800);
});

/* ═══════════════ UI 핸들링 ═══════════════ */
const IH=44, pd=[], pi={}, ps={}, AS={cal:'solar', gen:'male'};
let LD=null;

function buildPickers(){
  const w=document.getElementById('pw');
  const fields = [{id:'year',l:'년',s:1920,e:120},{id:'month',l:'월',s:1,e:12},{id:'day',l:'일',s:1,e:31},{id:'hour',l:'시',s:0,e:24}];
  fields.forEach(f => {
    const items = Array.from({length:f.e}, (_,i)=>({v:f.s+i, t:String(f.s+i).padStart(2,'0')}));
    pd.push({id:f.id, items});
    const cw=document.createElement('div'); cw.className='cw'; cw.style.flex='1';
    const cc=document.createElement('div'); cc.className='cc'; cc.style.height='220px'; cc.style.overflow='hidden';
    const ci=document.createElement('div'); ci.className='ci'; ci.style.padding='88px 0';
    items.forEach(it => { const el=document.createElement('div'); el.className='citem'; el.textContent=it.t; ci.appendChild(el); });
    cc.appendChild(ci); cw.appendChild(cc); w.appendChild(cw);
    pi[f.id]=ci; setupDrag(cc, f.id, ci);
    setIdx(f.id, items.length/2, ci, false);
  });
}
function setIdx(id,idx,ci,an){
  idx=Math.round(idx); const d=pd.find(x=>x.id===id); 
  idx=Math.max(0,Math.min(d.items.length-1,idx)); ps[id]=idx;
  ci.style.transition=an?'transform .2s':'none'; ci.style.transform=`translateY(${-idx*IH}px)`;
  Array.from(ci.children).forEach((el,i)=>el.classList.toggle('sel', i===idx));
}
function setupDrag(cc,id,ci){
  let sY, sO, drag=false;
  cc.addEventListener('touchstart', e=>{drag=true; sY=e.touches[0].clientY; sO=new DOMMatrix(getComputedStyle(ci).transform).m42; ci.style.transition='none';});
  cc.addEventListener('touchmove', e=>{if(!drag)return; const move=e.touches[0].clientY-sY; ci.style.transform=`translateY(${sO+move}px)`; e.preventDefault();}, {passive:false});
  cc.addEventListener('touchend', ()=>{drag=false; const off=new DOMMatrix(getComputedStyle(ci).transform).m42; setIdx(id, Math.round(-off/IH), ci, true);});
}

function setCal(t){AS.cal=t; document.getElementById('bSol').classList.toggle('on', t==='solar'); document.getElementById('bLun').classList.toggle('on', t==='lunar');}
function setGen(g){AS.gen=g; document.getElementById('bMal').classList.toggle('mon', g==='male'); document.getElementById('bFem').classList.toggle('fon', g==='female');}

function calc(){
  const v = pd.map(d => d.items[ps[d.id]].v);
  const s = calcSaju(v[0], v[1], v[2], v[3]);
  const {ys,yb,ms,mb,ds,db,hs,hb}=s;
  document.getElementById('rhdr').innerHTML = `양력 ${v[0]}년 ${v[1]}월 ${v[2]}일 ${v[3]}시<br>${AS.gen==='male'?'남성':'여성'} · ${ANI[yb]}띠`;
  const cols=[{l:'년',s:ys,b:yb},{l:'월',s:ms,b:mb},{l:'일',s:ds,b:db},{l:'시',s:hs,b:hb}];
  document.getElementById('sg').innerHTML = cols.map(c => `<div class="sc"><div style="font-size:10px; color:var(--gold)">${c.l}</div><div class="shj">${CH[c.s]}<br>${JH[c.b]}</div><div style="font-size:11px">${CG[c.s]}${JJ[c.b]}</div></div>`).join('');
  
  LD = { ...s, gen:AS.gen, sstr: `${v[0]}-${v[1]}-${v[2]}` };
  document.getElementById('result').style.display='block';
  svH({saju:`${CH[ys]}${JH[yb]} ${CH[ms]}${JH[mb]} ${CH[ds]}${JH[db]}`, gY:v[0], gM:v[1], gD:v[2]});
}

async function reqAI(){
  const box = document.getElementById('aisecs');
  box.innerHTML = "분석 중...";
  try {
    const res = await fetch('https://my-saju-api.onrender.com/api/saju', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ model:'gemini', messages:[{role:'user', content: `${LD.sstr}생 사주 분석.`}] })
    });
    const data = await res.json();
    box.innerHTML = `<div class="aitxt">${data.content[0].text}</div>`;
  } catch(e) { box.innerHTML = "연결 실패"; }
}

async function reqUnseAI(type){
  const box = document.getElementById('unseSecs');
  box.innerHTML = "운세 불러오는 중...";
  try {
    const res = await fetch('https://my-saju-api.onrender.com/api/saju', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ model:'gemini', messages:[{role:'user', content: `${type} 운세 알려줘.`}] })
    });
    const data = await res.json();
    box.innerHTML = `<div class="aitxt">${data.content[0].text}</div>`;
  } catch(e) { box.innerHTML = "연결 실패"; }
}

function gh(){ return JSON.parse(localStorage.getItem('msr_h')||'[]'); }
function svH(e){ let h=gh(); h.unshift(e); h=h.slice(0,5); localStorage.setItem('msr_h', JSON.stringify(h)); }
function renderRecent(){
  const h=gh(); const list=document.getElementById('recentList');
  if(!h.length) { list.innerHTML="기록이 없습니다."; return; }
  list.innerHTML = h.map(e => `<div class="rec-card">${e.saju}</div>`).join('');
}

buildPickers();
</script>
</body>
</html>
