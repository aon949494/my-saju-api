<!DOCTYPE html>
<html lang="ko">
<head>

<title>만세력</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--gold:#c8a96e;--gold2:#e8c98a;--gb:rgba(200,169,110,0.3);--text:#f0ead8;--dim:rgba(240,234,216,0.5);--muted:rgba(240,234,216,0.3);--ih:44px;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hdr{text-align:center;padding:32px 24px 16px}
.hdr::after{content:'';display:block;width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto 0}
.hdr-sym{font-size:26px;letter-spacing:8px;color:var(--gold);font-family:'Noto Serif KR',serif;font-weight:300;opacity:.8;margin-bottom:6px}
.hdr-ttl{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:600;color:var(--gold2);letter-spacing:4px}
.hdr-sub{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:4px}
.card{margin:0 16px 14px;background:var(--bg2);border:1px solid var(--gb);border-radius:16px;overflow:hidden}
.srow{display:flex;justify-content:space-between;padding:14px 16px 8px;gap:10px}
.tg{display:flex;background:var(--bg3);border:1px solid var(--gb);border-radius:10px;overflow:hidden;flex:1}
.tb{flex:1;height:36px;background:transparent;border:none;font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--dim);cursor:pointer;transition:all .2s;letter-spacing:1px}
.tb.on{background:rgba(200,169,110,0.15);color:var(--gold2);font-weight:500}
.tb.mon{background:rgba(74,126,200,0.2);color:#7ab0f0;font-weight:500}
.tb.fon{background:rgba(200,74,126,0.2);color:#f07ab0;font-weight:500}
.lrow{display:flex;align-items:center;padding:4px 20px 8px;gap:8px}
.llbl{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--dim)}
.llbl input{accent-color:var(--gold);width:16px;height:16px}
.pw{display:flex;height:220px;position:relative;padding:0 8px}
.phl{position:absolute;top:50%;left:8px;right:8px;transform:translateY(-50%);height:var(--ih);border-top:1px solid var(--gb);border-bottom:1px solid var(--gb);pointer-events:none;z-index:10;border-radius:4px;background:rgba(200,169,110,0.06)}
.pft{position:absolute;top:0;left:8px;right:8px;height:80px;background:linear-gradient(to bottom,var(--bg2),transparent);pointer-events:none;z-index:9}
.pfb{position:absolute;bottom:0;left:8px;right:8px;height:80px;background:linear-gradient(to top,var(--bg2),transparent);pointer-events:none;z-index:9}
.cw{flex:1;display:flex;flex-direction:column;align-items:center}
.cl{font-size:10px;color:var(--muted);letter-spacing:1px;padding:10px 0 2px;flex-shrink:0}
.cc{flex:1;width:100%;overflow:hidden;cursor:grab;touch-action:none}
.cc:active{cursor:grabbing}
.ci{will-change:transform}
.citem{height:var(--ih);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--dim);font-family:'Noto Serif KR',serif;font-weight:300;user-select:none;transition:color .15s,font-size .15s}
.citem.sel{color:var(--gold2);font-size:17px;font-weight:600}
.citem.nr{color:rgba(240,234,216,0.7)}
.bw{padding:2px 16px 14px}
.bcalc{width:100%;height:52px;background:linear-gradient(135deg,#8b7340,#c8a96e,#8b7340);border:none;border-radius:12px;color:#1a1208;font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;letter-spacing:4px;cursor:pointer;transition:transform .1s}
.bcalc:active{transform:scale(.98)}
.result{display:none;margin:0 16px 16px}
.result.show{display:block;animation:fu .5s ease}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.rhdr{text-align:center;padding:18px 0 14px;border-bottom:1px solid var(--gb);margin-bottom:14px}
.rdate{font-size:12px;color:var(--dim);margin-bottom:5px;line-height:1.8}
.rlunar{font-size:12px;color:rgba(200,169,110,.7);margin-bottom:5px}
.rmeta{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.ranim{font-size:13px;color:var(--gold);letter-spacing:2px}
.rgen{font-size:12px;padding:3px 10px;border-radius:20px;letter-spacing:1px}
.rgen.m{background:rgba(74,126,200,.2);color:#7ab0f0;border:1px solid rgba(74,126,200,.3)}
.rgen.f{background:rgba(200,74,126,.2);color:#f07ab0;border:1px solid rgba(200,74,126,.3)}
.rjg{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sc{background:var(--bg3);border:1px solid var(--gb);border-radius:12px;padding:10px 4px;text-align:center}
.scl{font-size:10px;color:var(--gold);letter-spacing:1px;margin-bottom:6px}
.shj{font-family:'Noto Serif KR',serif;font-size:20px;color:var(--text);line-height:1.3;margin-bottom:4px}
.shg{font-size:11px;color:var(--dim);letter-spacing:1px}
.soh{font-size:10px;margin-top:7px;display:flex;flex-direction:column;gap:3px;align-items:center}
.tag{display:inline-block;padding:2px 5px;border-radius:4px;font-size:10px}
.tyn{background:rgba(100,120,200,.2);color:#a0b0e8}.tyg{background:rgba(200,100,80,.2);color:#e8a090}
.twd{background:rgba(60,160,80,.2);color:#80d090}.tfi{background:rgba(220,80,60,.2);color:#f09080}
.tea{background:rgba(180,140,60,.2);color:#d4b870}.tme{background:rgba(180,180,200,.2);color:#c8c8e0}
.twa{background:rgba(60,120,200,.2);color:#80a8e8}
.s1l{text-align:center;padding:12px;background:var(--bg3);border:1px solid var(--gb);border-radius:12px;font-family:'Noto Serif KR',serif;font-size:19px;letter-spacing:6px;color:var(--gold2)}
.s1l span{font-size:11px;color:var(--muted);display:block;letter-spacing:8px;margin-top:5px}
.ohw{background:var(--bg3);border:1px solid var(--gb);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.oht{font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.ohb{display:flex;flex-direction:column;gap:6px}
.ohr{display:flex;align-items:center;gap:8px}
.ohn{font-size:12px;color:var(--dim);width:24px;text-align:center}
.ohbg{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.ohf{height:100%;border-radius:3px;transition:width .6s ease}
.ohc{font-size:11px;color:var(--muted);width:16px;text-align:right}
.bai{width:100%;height:48px;background:transparent;border:1px solid var(--gb);border-radius:12px;color:var(--gold);font-family:'Noto Serif KR',serif;font-size:14px;font-weight:600;letter-spacing:3px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.bai:hover{background:rgba(200,169,110,0.08);border-color:var(--gold)}
.bai:active{transform:scale(.98)}
.bai:disabled{opacity:.5;cursor:not-allowed}
.aip{display:none;margin-top:14px}
.aip.show{display:block;animation:fu .4s ease}
.aitabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.aitabs::-webkit-scrollbar{display:none}
.aitab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;border:1px solid var(--gb);background:transparent;color:var(--dim);cursor:pointer;transition:all .2s;letter-spacing:1px;font-family:'Noto Sans KR',sans-serif}
.aitab.on{background:rgba(200,169,110,0.15);color:var(--gold2);border-color:var(--gold)}
.aisec{display:none;background:var(--bg3);border:1px solid var(--gb);border-radius:14px;padding:18px 16px}
.aisec.show{display:block;animation:fu .3s ease}
.aist{font-family:'Noto Serif KR',serif;font-size:14px;color:var(--gold);letter-spacing:2px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(200,169,110,0.15)}
.aitxt{font-size:14px;line-height:1.9;color:var(--dim);word-break:keep-all;white-space:pre-wrap}
.cur{display:inline-block;width:2px;height:14px;background:var(--gold);margin-left:2px;vertical-align:middle;animation:bl .8s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
.aild{text-align:center;padding:32px 16px}
.aidots{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.aidots span{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.3;animation:dp 1.4s infinite both}
.aidots span:nth-child(2){animation-delay:.2s}.aidots span:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.ailtxt{font-size:12px;letter-spacing:2px;color:var(--muted)}
.aierr{background:rgba(180,60,60,0.1);border:1px solid rgba(180,60,60,0.3);border-radius:12px;padding:14px 16px;font-size:13px;color:#e09090;text-align:center;line-height:1.7}
.hsec{display:none;margin:0 16px 32px}
.hslbl{font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:10px}
.hcard{background:var(--bg2);border:1px solid var(--gb);border-radius:12px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .2s}
.hcard:hover{background:var(--bg3)}
.hcl{flex:1;min-width:0}
.hcd{font-size:12px;color:var(--dim);margin-bottom:3px}
.hclu{font-size:11px;color:rgba(200,169,110,.6);margin-bottom:3px}
.hcs{font-family:'Noto Serif KR',serif;font-size:15px;color:var(--gold2);letter-spacing:4px}
.hcb{font-size:11px;padding:3px 8px;border-radius:10px;flex-shrink:0}
.hcb.m{background:rgba(74,126,200,.2);color:#7ab0f0}.hcb.f{background:rgba(200,74,126,.2);color:#f07ab0}
.hcdel{background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1}
::-webkit-scrollbar{display:none}
</style>
</head>

<script>
const CG=['갑','을','병','정','무','기','경','신','임','계'];
const CH=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const JJ=['자','축','인','묘','진','사','오','미','신','유','술','해'];
const JH=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const ANI=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
const OHC=['목','목','화','화','토','토','금','금','수','수'];
const UYC=['양','음','양','음','양','음','양','음','양','음'];
const OHJ=['수','토','목','목','토','화','화','토','금','금','토','수'];
const UYJ=['양','음','양','음','양','음','양','음','양','음','양','음'];
const JGD=[['소한',285,1,1,12],['입춘',315,2,2,1],['경칩',345,3,3,2],['청명',15,4,4,3],['입하',45,5,5,4],['망종',75,6,6,5],['소서',105,7,7,6],['입추',135,8,8,7],['백로',165,9,9,8],['한로',195,10,10,9],['입동',225,11,11,10],['대설',255,12,0,11]];
const JGG=[[270,12],[300,1],[330,2],[0,3],[30,4],[60,5],[90,6],[120,7],[150,8],[180,9],[210,10],[240,11]];
const OHB={목:'#4a9a6a',화:'#c44040',토:'#b89040',금:'#9090b8',수:'#4070c8'};
const CATS=[{id:'total',lbl:'✦ 총운',ic:'✦',ti:'총 운'},{id:'nature',lbl:'⊕ 성격',ic:'⊕',ti:'성격 기질'},{id:'wealth',lbl:'◈ 재물',ic:'◈',ti:'재물 직업'},{id:'love',lbl:'♡ 애정',ic:'♡',ti:'애정 인연'},{id:'health',lbl:'☽ 건강',ic:'☽',ti:'건강 주의'}];

function jd(y,m,d,h){if(h===undefined)h=12;if(m<=2){y--;m+=12;}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5+h/24;}
function slon(j){const T=(j-2451545)/36525,L0=((280.46646+36000.76983*T+.0003032*T*T)%360+360)%360,M=((357.52911+35999.05029*T-.0001537*T*T)%360+360)%360*Math.PI/180,C=(1.914602-.004817*T-.000014*T*T)*Math.sin(M)+(.019993-.000101*T)*Math.sin(2*M)+.000289*Math.sin(3*M),om=(125.04-1934.136*T)*Math.PI/180;return((L0+C-.00569-.00478*Math.sin(om))%360+360)%360;}
function fjd(y,lon,am){const j0=jd(y,am,1);let lo=j0-20,hi=j0+20;function dv(v){let x=slon(v)-lon;if(x>180)x-=360;else if(x<-180)x+=360;return x;}for(let i=0;i<50;i++){const mid=(lo+hi)/2;if(dv(lo)*dv(mid)<=0)hi=mid;else lo=mid;}return(lo+hi)/2;}
function mpillar(bjd,by){const pool=[];for(const y of[by-1,by,by+1])for(const[n,l,am,br,mn]of JGD)pool.push([fjd(y,l,am),n,br,mn]);pool.sort((a,b)=>a[0]-b[0]);let best=pool[0];for(const e of pool){if(e[0]<=bjd)best=e;else break;}return{n:best[1],br:best[2],mn:best[3]};}
function calcSaju(Y,M,D,H,MIN){if(MIN===undefined)MIN=0;const dt=new Date(Y,M-1,D,H-9,MIN,0),bjd=jd(dt.getFullYear(),dt.getMonth()+1,dt.getDate(),dt.getHours()+dt.getMinutes()/60),ip=fjd(Y,315,2),sy=bjd>=ip?Y:Y-1,ys=((sy-4)%10+10)%10,yb=((sy-4)%12+12)%12,{n:jn,br:mb,mn:mn}=mpillar(bjd,Y),ms=((ys%5*2+2)%10+mn-1)%10,ddt=H>=23?new Date(Y,M-1,D+1,12):new Date(Y,M-1,D,12),djd=jd(ddt.getFullYear(),ddt.getMonth()+1,ddt.getDate(),12),di=(Math.floor(djd+.5)+49)%60,ds=di%10,db=di%12,hb=H===23?0:Math.floor((H+1)/2)%12,hs=((ds%5*2)%10+hb)%10;return{ys,yb,sy,ms,mb,jn,ds,db,hs,hb};}

function tr(d){return d*Math.PI/180;}
function nmJDE(k){const T=k/1236.85,T2=T*T,T3=T2*T,T4=T3*T;let J=2451550.09766+29.530588861*k+.00015437*T2-.00000015*T3+.00000000073*T4;const E=1-.002516*T-.0000074*T2,M=tr(2.5534+29.1053567*k-.0000014*T2),Mp=tr(201.5643+385.81693528*k+.0107582*T2+.00001238*T3),F=tr(160.7108+390.67050284*k-.0016118*T2-.00000227*T3),Om=tr(124.7746-1.56375588*k+.0020672*T2+.00000215*T3);J+=-.40720*Math.sin(Mp)+.17241*E*Math.sin(M)+.01608*Math.sin(2*Mp)+.01039*Math.sin(2*F)+.00739*E*Math.sin(Mp-M)-.00514*E*Math.sin(Mp+M)+.00208*E*E*Math.sin(2*M)-.00111*Math.sin(Mp-2*F)-.00057*Math.sin(Mp+2*F)+.00056*E*Math.sin(2*Mp+M)-.00042*Math.sin(3*Mp)+.00042*E*Math.sin(M+2*F)+.00038*E*Math.sin(M-2*F)-.00024*E*Math.sin(2*Mp-M)-.00017*Math.sin(Om)-.00007*Math.sin(Mp+2*M)+.00004*Math.sin(2*Mp-2*F)+.00004*Math.sin(3*M)+.00003*Math.sin(Mp+M-2*F)+.00003*Math.sin(2*Mp+2*F)-.00003*Math.sin(Mp+M+2*F)+.00003*Math.sin(Mp-M+2*F)-.00002*Math.sin(Mp-M-2*F)-.00002*Math.sin(3*Mp+M)+.00002*Math.sin(4*Mp);const C=[[.000325,299.77+.107408*k-.009173*T2],[.000165,251.88+.016321*k],[.000164,251.83+26.651886*k],[.000126,349.42+36.412478*k],[.00011,84.66+18.206239*k],[.000062,141.74+53.303771*k],[.00006,207.14+2.453732*k],[.000056,154.84+7.30686*k],[.000047,34.52+27.261239*k],[.000042,207.19+.121824*k],[.00004,291.34+1.844379*k],[.000037,161.72+24.198154*k],[.000035,239.56+25.513099*k],[.000023,331.55+3.592518*k]];for(const[a,g]of C)J+=a*Math.sin(tr(g));return J;}
function getMoons(jde1,jde2){const k0=Math.floor((2000+(jde1-2451545)/365.25-2000)*12.3685)-2,ms=[];for(let k=k0;;k++){const x=nmJDE(k);if(x>jde2+35)break;if(x>=jde1-35)ms.push({jde:x,dn:Math.floor(x+9/24+.5)});}return ms;}
function hasJ(d1,d2){const ya=Math.round(2000+(d1-2451545)/365.25);for(let y=ya-1;y<=ya+1;y++)for(const[l,am]of JGG){const dn=Math.floor(fjd(y,l,am)+9/24+.5);if(dn>=d1&&dn<d2)return true;}return false;}
function buildM(dzA,dzB){const adN=Math.floor(dzA+9/24+.5),bdN=Math.floor(dzB+9/24+.5),ms=getMoons(dzA-35,dzB+5);let aI=-1,bI=-1;for(let i=0;i<ms.length-1;i++){if(aI<0&&ms[i].dn<=adN&&adN<ms[i+1].dn)aI=i;if(bI<0&&ms[i].dn<=bdN&&bdN<ms[i+1].dn)bI=i;}if(aI<0||bI<0)return null;const res=[],leap=(bI-aI)===13;let mn=11,prev=11,ld=false;for(let i=aI;i<bI;i++){const s=ms[i].dn,e=ms[i+1].dn,h=hasJ(s,e);if(leap&&!ld&&!h&&i>aI){res.push({m:prev,isLeap:true,s,e});ld=true;}else{res.push({m:mn,isLeap:false,s,e});prev=mn;mn=(mn%12)+1;}}return res;}

function l2g(lY,lM,lD,isLeap){if(isLeap===undefined)isLeap=false;for(const dy of[lY-1,lY]){const months=buildM(fjd(dy,270,12),fjd(dy+1,270,12));if(!months)continue;const lm=months.find(function(x){return x.m===lM&&x.isLeap===isLeap;});if(!lm)continue;if((lm.m>=11?dy:dy+1)!==lY)continue;if(lD<1||lD>lm.e-lm.s)return null;const n=lm.s+lD-1,al=Math.floor((n-1867216.25)/36524.25),A=n+1+al-Math.floor(al/4),B=A+1524,Cv=Math.floor((B-122.1)/365.25),Dv=Math.floor(365.25*Cv),Ev=Math.floor((B-Dv)/30.6001),day=B-Dv-Math.floor(30.6001*Ev),month=Ev<14?Ev-1:Ev-13,year=month>2?Cv-4716:Cv-4715;return{year,month,day};}return null;}

반드시 아래의 5개 태그를 정확히 사용하세요. 아래는 당신이 따라야 할 '문장 구조와 분석 깊이'를 보여주는 훌륭한 예시입니다. 이 예시들의 말투와 전개 방식을 완벽하게 모방하되, 내용은 반드시 현재 주어진 【사주 정보】에 맞게 완전히 새로 분석하여 작성하세요.

(작성 방식 예시: 일간 을목(乙木)은 타고난 성품이 온화하고 유연하여 주변 사람들과 잘 어울리며 포용력이 뛰어납니다... 그러나 사주에 강하게 드러난 상관(傷官)과 관살(官殺)의 기운은 겉모습과 달리 내면에는 강인하고 독립적인 기질을 품고 있음을 보여줍니다... 옳고 그름에 대한 판단이 분명하여 불의를 보면 참지 못하는 정의로운 면도 있습니다. 때로는 자기 주장이 강하고 직선적이라 오해를 받을 수도 있으나, 이는 자신의 신념을 지키려는 강한 의지에서 비롯됩니다.)

[LOVE]
(작성 방식 예시: 애정운은 다소 복잡한 양상을 띨 수 있습니다. 여성 사주에서 관살(官殺)은 배우자나 남편을 의미하는데, 본 사주에는 유금(酉金)과 신금(辛金)으로 관살 기운이 강하게 나타납니다. 이는 인연이 많거나 배우자 복이 좋다는 의미로 해석될 수 있으나... 따라서 배우자를 선택할 때는 자신의 개성을 존중해주고 이해심이 많은 상대를 만나는 것이 중요합니다. 연애 초기에는 매력적이고 활발한 모습으로 인기를 얻지만, 결혼 후에는 서로의 가치관을 존중하고 대화로 문제를 해결하려는 노력이 필요합니다. 늦은 결혼이나 자신만의 전문성을 갖춘 후 결혼하는 것이 안정적인 관계를 유지하는 데 도움이 될 수 있습니다.)

[HEALTH]
(작성 방식 예시: 건강 면에서는 오행의 불균형으로 인한 주의가 필요합니다. 일간 을목(乙木)이 겨울 축월(丑月)에 태어나 차가운 기운이 강하고, 금(金) 기운이 강하여 목(木) 기운이 손상되기 쉽습니다. 이는 간, 담, 신경계통의 약화를 의미할 수 있으며, 스트레스에 취약해질 수 있습니다... 특히 상관견관(傷官見官)의 구조는 심리적인 압박감이나 스트레스를 유발하기 쉬워 신경성 질환이나 소화기 계통의 문제를 겪을 수 있습니다. 평소 규칙적인 생활 습관과 균형 잡힌 식단으로 건강을 관리하고, 충분한 휴식과 명상, 취미 활동 등을 통해 스트레스를 해소하는 것이 중요합니다.)`;

    btn.innerHTML='<span>&#10022;</span> 다시 시도';
    btn.disabled=false;
  }
  
  const ctrl=new AbortController(),tid=setTimeout(function(){ctrl.abort();},40000);
  let res;
  try{
    res = await fetch('/api/saju',{
      method:'POST',
      signal:ctrl.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'gemini',
        max_tokens:8000,
        // 💡 원래 쓰시던 system 프롬프트로 복구해 두었습니다!
        system:'당신은 한국 전통 사주명리학 전문가입니다. 반드시 [TOTAL] [NATURE] [WEALTH] [LOVE] [HEALTH] 태그를 정확히 사용하세요.',
        messages:[{role:'user',content:buildPrompt(LD)}]
      })
    });
  }catch(e){
    clearTimeout(tid);
    if(e.name==='AbortError')showE('요청 시간 초과','다시 시도해주세요');
    else showE('서버 연결 실패','python server.py 실행 중인지 확인');
    return;
  }
  clearTimeout(tid);
  
  if(!res.ok){
    let msg='오류 '+res.status;
    try{const j=await res.json();msg=j.error?j.error.message||msg:msg;}catch(x){}
    showE('풀이를 받지 못했습니다',msg);
    return;
  }
  
  let data;
  try{
    data=await res.json();
  }catch(e){
    showE('응답 파싱 실패',e.message);
    return;
  }
  
  const raw=data.content&&data.content[0]?data.content[0].text||'':'';
  if(!raw){
    showE('응답이 비어있습니다','');
    return;
  }
  
  const TAGS = [{tag:'TOTAL',id:'total'}, {tag:'NATURE',id:'nature'}, {tag:'WEALTH',id:'wealth'}, {tag:'LOVE',id:'love'}, {tag:'HEALTH',id:'health'}];
  const secs = { total: '', nature: '', wealth: '', love: '', health: '' };
  let tagFound = false;

  for (let i = 0; i < TAGS.length; i++) {
    const regex = new RegExp(`\\[?${TAGS[i].tag}\\]?`, 'i');
    const match = raw.match(regex);
    if (!match) {
      secs[TAGS[i].id] = '내용을 준비 중이거나 분석할 수 없습니다.';
      continue;
    }
    tagFound = true;
    let s = match.index + match[0].length;
    let e = raw.length;
    for (let j = i + 1; j < TAGS.length; j++) {
      const nextMatch = raw.slice(s).match(new RegExp(`\\[?${TAGS[j].tag}\\]?`, 'i'));
      if (nextMatch) {
        e = s + nextMatch.index;
        break;
      }
    }
    secs[TAGS[i].id] = raw.slice(s, e).replace(/^[^가-힣a-zA-Z0-9]+/, '').trim();
  }

  if (!tagFound) {
    secs['total'] = raw || '풀이 내용을 찾을 수 없습니다.';
  }

  stopL();

  try {
    const te=document.getElementById('aitabs'),se=document.getElementById('aisecs');
    CATS.forEach(function(cat,i){
      const tab=document.createElement('button');
      tab.className='aitab'+(i===0?' on':'');
      tab.textContent=cat.lbl;
      tab.onclick=function(){swTab(cat.id);};
      tab.id='atb-'+cat.id;
      te.appendChild(tab);
      
      const sec=document.createElement('div');
      sec.className='aisec'+(i===0?' show':'');
      sec.id='asc-'+cat.id;
      sec.innerHTML='<div class="aist">'+cat.ic+' '+cat.ti+'</div><div class="aitxt" id="atx-'+cat.id+'"></div>';
      se.appendChild(sec);
    });
    
    AT='total';
    for(const tg of TAGS){
      const el=document.getElementById('atx-'+tg.id);
      if(!el)continue;
      if(tg.id==='total') tyTxt(el, secs[tg.id] || '내용 없음', 10);
      else el.textContent = secs[tg.id] || '내용 없음';
    }
  } catch (err) {
    console.error("화면 그리기 에러:", err);
  }
  
  btn.innerHTML='<span>&#10022;</span> 풀이 다시 받기';
  btn.disabled=false;
}

function tyTxt(el,text,sp){el.innerHTML='';let i=0;const cur=document.createElement('span');cur.className='cur';el.appendChild(cur);const t=setInterval(function(){if(i>=text.length){clearInterval(t);cur.remove();return;}cur.insertAdjacentText('beforebegin',text[i++]);},sp||12);}
function swTab(sid){AT=sid;document.querySelectorAll('.aitab').forEach(function(t){t.className='aitab'+(t.id==='atb-'+sid?' on':'');});document.querySelectorAll('.aisec').forEach(function(s){s.className='aisec'+(s.id==='asc-'+sid?' show':'');});}

function gh(){try{return JSON.parse(localStorage.getItem('msr_h')||'[]');}catch(e){return[];}}
function svH(e){let h=gh();h=h.filter(function(x){return!(x.gY===e.gY&&x.gM===e.gM&&x.gD===e.gD&&x.hour===e.hour&&x.min===e.min&&x.gen===e.gen);});h.unshift(e);if(h.length>5)h=h.slice(0,5);localStorage.setItem('msr_h',JSON.stringify(h));rdH();}
function dlH(i){const h=gh();h.splice(i,1);localStorage.setItem('msr_h',JSON.stringify(h));rdH();}
function rdH(){const h=gh(),sec=document.getElementById('hsec'),list=document.getElementById('hlist');if(!h.length){sec.style.display='none';return;}sec.style.display='block';list.innerHTML=h.map(function(e,i){return '<div class="hcard"><div class="hcl" onclick="ldH('+i+')"><div class="hcd">양력 '+e.gY+'년 '+p2(e.gM)+'월 '+p2(e.gD)+'일 '+p2(e.hour)+'시</div>'+(e.lstr?'<div class="hclu">'+e.lstr+'</div>':'')+'<div class="hcs">'+e.saju+'</div></div><span class="hcb '+(e.gen==='male'?'m':'f')+'">'+(e.gen==='male'?'남 ♂':'여 ♀')+'</span><button class="hcdel" onclick="dlH('+i+');event.stopPropagation()">×</button></div>';}).join('');}
function ldH(i){const h=gh()[i];if(!h)return;setCal(h.cal);setGen(h.gen);if(h.cal==='lunar'&&h.leap){document.getElementById('lchk').checked=true;AS.leap=true;}function sv(id,val){const d=pd.find(function(x){return x.id===id;});if(!d)return;const idx=d.items.findIndex(function(x){return x.v===val;});if(idx>=0)setIdx(id,idx,pi[id],true);}sv('year',h.year);sv('month',h.month);sv('day',h.day);sv('hour',h.hour);sv('min',h.min);window.scrollTo({top:0,behavior:'smooth'});}

buildPickers();rdH();
</script>
</body>
